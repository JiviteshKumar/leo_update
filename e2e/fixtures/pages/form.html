<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Leo fixture: signup form</title>
  <style>
    body { font: 15px system-ui, sans-serif; max-width: 520px; margin: 40px auto; }
    label { display: block; margin: 12px 0 4px; }
    input[type=text], input[type=email], select { width: 100%; padding: 6px; }
    button { margin-top: 16px; padding: 8px 16px; }
    #result { margin-top: 20px; white-space: pre; font-family: monospace; }
  </style>
</head>
<body>
  <h1>Sign up</h1>
  <form id="signup">
    <label for="name">Full name</label>
    <input id="name" name="name" type="text" placeholder="Your name">

    <label for="email">Email</label>
    <input id="email" name="email" type="email" placeholder="you@example.com">

    <label for="country">Country</label>
    <select id="country" name="country">
      <option value="">Choose…</option>
      <option value="in">India</option>
      <option value="de">Germany</option>
      <option value="jp">Japan</option>
    </select>

    <label><input id="terms" name="terms" type="checkbox"> I accept the terms</label>

    <label for="password">Password</label>
    <input id="password" name="password" type="password">

    <button id="submit" type="submit">Submit</button>
  </form>
  <div id="result"></div>

  <script>
    // Redesign variants used by the repair tests. All of them churn ids,
    // names and classes, the way a rebuild or a new CSS framework does:
    //   v=2 the button is relabelled too, so nothing recognisable survives
    //   v=3 relabelled, plus an identical dead button after the real one
    //   v=4 relabelled, with the identical dead button first (a wrong pick)
    //   v=5 the submit <button> becomes a styled <a role=button>, but the
    //       labels and its wording survive, so Leo can still recognise it
    const variant = new URLSearchParams(location.search).get('v');
    if (variant) {
      const rename = (id, next) => {
        const el = document.getElementById(id);
        el.id = next;
        el.removeAttribute('name');
        el.className = 'x' + Math.random().toString(16).slice(2, 8);
      };
      rename('name', 'fullName');
      rename('email', 'mail');
      rename('country', 'region');
      rename('terms', 'agree');
      rename('password', 'pw');
      const btn = document.getElementById('submit');
      btn.id = 'send';
      if (variant === '5') {
        // The rebuild swapped the <button> for a link styled as a button.
        // Every recorded selector was tag- or id-qualified, so all of them
        // break, but the control still reads "Submit" in the same place.
        const link = document.createElement('a');
        link.id = 'send';
        link.setAttribute('role', 'button');
        link.className = btn.className;
        link.style.cssText = 'display:inline-block;margin-top:16px;padding:8px 16px;border:1px solid #888;cursor:pointer';
        link.textContent = 'Submit';
        link.addEventListener('click', () => document.getElementById('signup').requestSubmit());
        btn.replaceWith(link);
      } else {
        btn.textContent = 'Send form';
      }
      document.querySelectorAll('label[for]').forEach((l) => l.removeAttribute('for'));
      if (variant === '3' || variant === '4') {
        // A second control that looks exactly the same and sits in the same
        // place, but does nothing: only understanding the page tells them
        // apart. In v=4 it comes first, so a careless repair picks it.
        const decoy = document.createElement('button');
        decoy.type = 'button';
        decoy.id = 'decoy';
        decoy.textContent = btn.textContent;
        if (variant === '3') btn.after(decoy);
        else btn.before(decoy);
      }
    }
    document.getElementById('signup').addEventListener('submit', (e) => {
      e.preventDefault();
      const f = e.target;
      const val = (sel) => f.querySelector(sel);
      document.getElementById('result').textContent = JSON.stringify({
        name: val('input[type=text]').value,
        email: val('input[type=email]').value,
        country: val('select').value,
        terms: val('input[type=checkbox]').checked,
        passwordLength: val('input[type=password]').value.length,
      });
    });
  </script>
</body>
</html>
