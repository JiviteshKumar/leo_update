<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Leo demo: a site that keeps changing</title>
  <style>
    body { font: 15px system-ui, sans-serif; max-width: 560px; margin: 40px auto; }
    label { display: block; margin: 12px 0 4px; }
    input { width: 100%; padding: 6px; }
    button, a.btn { margin-top: 16px; padding: 8px 16px; }
    a.btn { display: inline-block; border: 1px solid #888; border-radius: 4px; cursor: pointer; text-decoration: none; color: inherit; }
    #banner { background: #f3f4f6; border-left: 4px solid #6366f1; padding: 10px 12px; }
    #result { margin-top: 20px; white-space: pre; font-family: monospace; }
    footer { margin-top: 28px; font-size: 13px; color: #666; }
  </style>
</head>
<body>
  <h1>Sign up</h1>
  <p id="banner"></p>

  <form id="signup">
    <label for="name">Full name</label>
    <input id="name" name="name" type="text" placeholder="Your name">

    <label for="email">Email</label>
    <input id="email" name="email" type="email" placeholder="you@example.com">

    <button id="submit" type="submit">Submit</button>
  </form>
  <div id="result"></div>

  <footer><a href="?reset=1">Start over</a> — back to visit 1.</footer>

  <script>
  (() => {
    // A demo of self-repair you can drive by hand: the page rebuilds itself a
    // little more on each visit, the way a real site does between releases.
    //   visit 1  the original — record here
    //   visit 2  new ids and classes, and Submit is now a link, not a button
    //   visit 3+ the control is an unlabelled icon: nothing is recognisable
    const KEY = 'leo-demo-visit';
    if (new URLSearchParams(location.search).get('reset')) {
      localStorage.removeItem(KEY);
      // replace() doesn't stop this script, so leave before counting a visit.
      location.replace(location.pathname);
      return;
    }
    const visit = Number(localStorage.getItem(KEY) || '0') + 1;
    localStorage.setItem(KEY, String(visit));

    const churn = () => {
      const rename = (id, next) => {
        const el = document.getElementById(id);
        el.id = next;
        el.removeAttribute('name');
        el.className = 'x' + Math.random().toString(16).slice(2, 8);
      };
      rename('name', 'fullName');
      rename('email', 'mail');
      document.querySelectorAll('label[for]').forEach((l) => l.removeAttribute('for'));
    };

    const replaceSubmit = (make) => {
      const btn = document.getElementById('submit');
      const next = make();
      next.addEventListener('click', () => document.getElementById('signup').requestSubmit());
      btn.replaceWith(next);
    };

    const banner = document.getElementById('banner');
    if (visit === 1) {
      banner.textContent =
        'Visit 1 — the original page. Record a workflow here: type a name and press Submit.';
    } else if (visit === 2) {
      churn();
      replaceSubmit(() => {
        const a = document.createElement('a');
        a.className = 'btn';
        a.setAttribute('role', 'button');
        a.textContent = 'Submit';
        return a;
      });
      banner.textContent =
        'Visit 2 — the site was rebuilt: every id and class changed, the labels came loose, ' +
        'and Submit is a link now. Leo should recognise it and repair the step itself, with no AI.';
    } else {
      churn();
      replaceSubmit(() => {
        const b = document.createElement('button');
        b.type = 'button';
        b.id = 'c' + Math.random().toString(16).slice(2, 8);
        b.textContent = '\u27a4';
        return b;
      });
      banner.textContent =
        'Visit ' + visit + ' — now the control is an unlabelled icon with a random id. ' +
        'Nothing is recognisable, so Leo should stop and ask: use "Show me how".';
    }

    document.getElementById('signup').addEventListener('submit', (e) => {
      e.preventDefault();
      const f = e.target;
      document.getElementById('result').textContent = JSON.stringify({
        name: f.querySelector('input[type=text]').value,
        email: f.querySelector('input[type=email]').value,
      });
    });
  })();
  </script>
</body>
</html>
