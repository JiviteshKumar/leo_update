<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Leo demo: a site that keeps changing</title>
  <style>
    body { font: 15px system-ui, sans-serif; max-width: 720px; margin: 40px auto; color: #111; background: #fff; }
    .layout { display: grid; gap: 22px; }
    aside { font-size: 13px; color: #555; line-height: 1.5; }
    aside h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: #6b7280; }
    form { position: relative; }
    label { display: block; margin: 12px 0 4px; }
    input { width: 100%; padding: 6px; }
    button { margin-top: 16px; padding: 8px 16px; }
    #banner { background: #eef2ff; border-left: 4px solid #6366f1; padding: 10px 12px; }
    #result { margin-top: 20px; white-space: pre; font-family: ui-monospace, monospace; }
    footer { margin-top: 28px; font-size: 13px; color: #666; }
    .diff { margin-top: 22px; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px 14px; background: #fafafa; }
    .diff h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: #6b7280; margin: 0 0 8px; }
    .diff table { border-collapse: collapse; font: 12.5px ui-monospace, monospace; width: 100%; }
    .diff td { padding: 3px 6px; vertical-align: top; }
    .diff td:first-child { color: #6b7280; white-space: nowrap; }
    .diff .was { color: #b91c1c; }
    .diff .now { color: #047857; }

    /* The "rebuilt" look: a new design system AND a new layout, the way a real
       release lands. A sidebar appears and pushes the form right, and the
       submit control leaves the bottom of the form for the top-right corner. */
    body.rebuilt { font-family: Verdana, Geneva, sans-serif; background: #f8fafc; }
    body.rebuilt h1 { font-size: 26px; letter-spacing: -.02em; }
    body.rebuilt .layout { grid-template-columns: 190px 1fr; }
    body.rebuilt .layout.aside-right { grid-template-columns: 1fr 190px; }
    body.rebuilt .layout.aside-right aside { order: 2; }
    body.rebuilt form { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 58px 20px 62px; }
    body.rebuilt label { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: #64748b; }
    body.rebuilt input { border: 1px solid #cbd5e1; border-radius: 999px; padding: 10px 14px; background: #f8fafc; }
    body.rebuilt .cta {
      position: absolute; margin: 0;
      display: inline-block; padding: 11px 26px; border-radius: 999px;
      background: #0f766e; color: #fff; border: 0; cursor: pointer; text-decoration: none; font-weight: 600;
    }
    body.rebuilt .cta.c-tr { top: 14px; right: 18px; }
    body.rebuilt .cta.c-tl { top: 14px; left: 18px; }
    body.rebuilt .cta.c-br { bottom: 14px; right: 18px; }
    body.rebuilt .cta.c-bl { bottom: 14px; left: 18px; }
    body.rebuilt .icon { width: 44px; height: 44px; padding: 0; font-size: 18px; line-height: 1; }
  </style>
</head>
<body>
  <h1>Sign up</h1>
  <p id="banner"></p>

  <div class="layout">
    <aside hidden>
      <h3>Why sign up</h3>
      <p>A sidebar the old design never had &mdash; everything to its right has shifted over.</p>
    </aside>

    <form id="signup">
      <div class="field">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" placeholder="Your name">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="company">Company</label>
        <input id="company" name="company" type="text" placeholder="Where you work">
      </div>
      <div class="field">
        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="tel" placeholder="+91 00000 00000">
      </div>
      <button id="submit" type="submit">Submit</button>
    </form>
  </div>
  <div id="result"></div>

  <div class="diff" id="diff" hidden>
    <h2>What changed under the hood</h2>
    <table id="diffRows"></table>
  </div>

  <footer><a href="?reset=1">Start over</a> — back to visit 1.</footer>

  <script>
  (() => {
    // A demo of self-repair you can drive by hand: the page rebuilds itself a
    // little more on each visit, the way a real site does between releases.
    //   visit 1  the original — record here
    //   even     restyled, fields dealt into a new order, sidebar on either
    //            side, Submit a link in a random corner: still recognisable,
    //            so Leo should repair the step itself
    //   odd 3+   the same shuffle, but the control is an unlabelled icon —
    //            nothing left to know it by, so Leo should ask for help
    // Every reload re-randomises, so no two visits look alike.
    const KEY = 'leo-demo-visit';
    if (new URLSearchParams(location.search).get('reset')) {
      localStorage.removeItem(KEY);
      // replace() doesn't stop this script, so leave before counting a visit.
      location.replace(location.pathname);
      return;
    }
    const visit = Number(localStorage.getItem(KEY) || '0') + 1;
    localStorage.setItem(KEY, String(visit));

    const rows = [];
    const note = (what, was, now) => rows.push([what, was, now]);
    // Layout is random by default, so a person reloading gets a fresh deal
    // every time; ?corner=, ?aside= and ?order= pin it for the tests.
    const params = new URLSearchParams(location.search);
    const pick = (list, param) => {
      const forced = params.get(param);
      return forced && list.includes(forced) ? forced : list[Math.floor(Math.random() * list.length)];
    };

    // Held before anything is renamed or moved, so the form can always read
    // its own values back however far the page has been shuffled.
    const FIELD_IDS = ['name', 'email', 'company', 'phone'];
    const FIELDS = FIELD_IDS.map((id) => document.getElementById(id));
    const [nameInput, emailInput] = FIELDS;
    // What each field was called before the rebuild renamed it, so ?order=
    // can still name them.
    const WAS_CALLED = new Map(FIELDS.map((el, i) => [el, FIELD_IDS[i]]));

    const rename = (id, label) => {
      const el = document.getElementById(id);
      const cls = 'x' + Math.random().toString(16).slice(2, 8);
      note(label, '#' + id + ', input[name="' + id + '"]', 'input.' + cls + ' — no id, no name');
      el.id = cls;
      el.removeAttribute('name');
      el.className = cls;
    };

    const churn = () => {
      document.body.classList.add('rebuilt');
      document.querySelector('aside').hidden = false;
      rename('name', 'Full name field');
      rename('email', 'Email field');
      rename('company', 'Company field');
      rename('phone', 'Phone field');
      document.querySelectorAll('label[for]').forEach((l) => l.removeAttribute('for'));
      note('Labels', 'label[for="name"] tied to the field', 'plain text, tied to nothing');

      // Every reload deals the fields into a fresh order, so nothing that
      // remembered "the second input" or a position on the page survives.
      const form = document.getElementById('signup');
      const fields = Array.from(form.querySelectorAll('.field'));
      const forcedOrder = params.get('order');
      if (forcedOrder) {
        const wanted = forcedOrder.split(',');
        const key = (f) => wanted.indexOf(WAS_CALLED.get(f.querySelector('input')));
        fields.sort((a, b) => key(a) - key(b));
      } else {
        for (let i = fields.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [fields[i], fields[j]] = [fields[j], fields[i]];
        }
      }
      fields.forEach((f) => {
        f.className = 'field y' + Math.random().toString(16).slice(2, 6);
        form.append(f);
      });
      const order = fields.map((f) => f.querySelector('label').textContent).join(', ');
      note('Field order', 'Full name, Email, Company, Phone', order);

      // …and the sidebar lands on whichever side it feels like today.
      const side = pick(['left', 'right'], 'aside');
      document.querySelector('.layout').classList.toggle('aside-right', side === 'right');
      note('Page layout', 'one column, no sidebar', 'a sidebar on the ' + side + ' shifts the form across');
    };

    const CORNERS = {
      'c-tr': 'the top-right corner',
      'c-tl': 'the top-left corner',
      'c-br': 'the bottom-right corner',
      'c-bl': 'the bottom-left corner',
    };
    const replaceSubmit = (make) => {
      const btn = document.getElementById('submit');
      const next = make();
      const corner = pick(Object.keys(CORNERS), 'corner');
      next.classList.add(corner);
      next.addEventListener('click', () => document.getElementById('signup').requestSubmit());
      btn.replaceWith(next);
      note('Submit position', 'under the fields, on the left', CORNERS[corner] + ' of the card');
    };

    // Every cell is written as text, never as HTML: these strings ARE markup,
    // and parsing them would put a second live <button id="submit">Submit</button>
    // on the page — exactly what the recording keyed on, wired to nothing.
    const showDiff = () => {
      const table = document.getElementById('diffRows');
      const cell = (text, className) => {
        const td = document.createElement('td');
        td.textContent = text;
        if (className) td.className = className;
        return td;
      };
      for (const [what, was, now] of rows) {
        const tr = document.createElement('tr');
        tr.append(cell(what), cell(was, 'was'), cell('→'), cell(now, 'now'));
        table.append(tr);
      }
      document.getElementById('diff').hidden = false;
    };

    const banner = document.getElementById('banner');
    // ?kind=link|icon pins which rebuilt variant appears, so a test doesn't
    // have to count visits; left alone, they alternate on every reload.
    const kind = params.get('kind') || (visit === 1 ? 'original' : visit % 2 === 0 ? 'link' : 'icon');
    if (kind === 'original') {
      banner.innerHTML =
        '<b>Visit 1 — the original page.</b> Record a workflow here: fill in Full name and Email, then press Submit.';
    } else if (kind === 'link') {
      churn();
      replaceSubmit(() => {
        const a = document.createElement('a');
        a.className = 'cta';
        a.setAttribute('role', 'button');
        a.textContent = 'Submit';
        return a;
      });
      note('Submit control', '<button id="submit">Submit</button>', '<a role="button">Submit</a>');
      showDiff();
      banner.innerHTML =
        '<b>Visit ' + visit + ' — rebuilt, and dealt a fresh layout on every reload.</b> New ids and ' +
        'classes, loose labels, the four fields in a new order, the sidebar on either side, and Submit ' +
        'a link in a different corner each time. Nothing Leo recorded points anywhere useful — but the ' +
        'fields keep their placeholders and the control still says &ldquo;Submit&rdquo;, so Leo should ' +
        'work it out itself, with no AI.';
    } else {
      churn();
      const iconId = 'c' + Math.random().toString(16).slice(2, 8);
      replaceSubmit(() => {
        const b = document.createElement('button');
        b.type = 'button';
        b.id = iconId;
        b.className = 'cta icon';
        b.textContent = '\u27a4';
        return b;
      });
      note('Submit control', '<button id="submit">Submit</button>', '<button id="' + iconId + '">➤</button> — no words at all');
      showDiff();
      banner.innerHTML =
        '<b>Visit ' + visit + ' — same shuffle, but the control is an unlabelled icon</b> with a ' +
        'random id, in a random corner. There is nothing left to recognise it by, so Leo should stop ' +
        'and ask: use &ldquo;Show me how&rdquo;. Reload again for the recognisable version.';
    }

    document.getElementById('signup').addEventListener('submit', (e) => {
      e.preventDefault();
      document.getElementById('result').textContent = JSON.stringify({
        name: nameInput.value,
        email: emailInput.value,
      });
    });
  })();
  </script>
</body>
</html>
