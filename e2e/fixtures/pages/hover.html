<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Leo fixture: hover menus</title>
  <style>
    body { font: 15px system-ui; margin: 40px; }
    .menu { list-style: none; margin: 0; padding: 0; display: flex; gap: 24px; }
    .menu > li { position: relative; padding: 8px 0; }
    /* CSS-only: the submenu exists but is hidden until the <li> is hovered. */
    .sub { display: none; position: absolute; top: 100%; left: 0; list-style: none;
           margin: 0; padding: 4px; background: #fff; border: 1px solid #999; min-width: 160px; }
    .menu > li:hover .sub { display: block; }
    #account-wrap { display: inline-block; margin-top: 60px; padding: 8px; }
  </style>
</head>
<body>
  <h1>Hover menus</h1>
  <ul class="menu">
    <li><a href="#">Home</a></li>
    <li class="has-sub">
      <a href="#" id="reports">Reports ▾</a>
      <ul class="sub">
        <li><button id="vat" type="button">VAT return</button></li>
        <li><button id="payroll" type="button">Payroll</button></li>
      </ul>
    </li>
  </ul>

  <!-- JS-driven: the menu is shown on mouseenter and hidden on mouseleave. -->
  <div id="account-wrap">
    <span id="account">Account ▾</span>
    <div id="account-menu" hidden>
      <button id="signout" type="button">Sign out</button>
    </div>
  </div>

  <p id="result"></p>
  <script>
    const log = (s) => (document.getElementById('result').textContent += s + ';');
    document.getElementById('vat').addEventListener('click', () => log('vat'));
    document.getElementById('payroll').addEventListener('click', () => log('payroll'));
    const wrap = document.getElementById('account-wrap');
    const menu = document.getElementById('account-menu');
    wrap.addEventListener('mouseenter', () => (menu.hidden = false));
    wrap.addEventListener('mouseleave', () => (menu.hidden = true));
    document.getElementById('signout').addEventListener('click', () => log('signout'));
  </script>
</body>
</html>
