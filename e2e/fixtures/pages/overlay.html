<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Leo fixture: waits</title>
  <style>
    body { font: 15px system-ui; margin: 40px; }
    #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); color: #fff;
               display: flex; align-items: center; justify-content: center; font-size: 24px; }
    #spacer { height: 2200px; }
  </style>
</head>
<body>
  <h1>Slow page</h1>
  <button id="save" type="button">Save</button>
  <button id="confirm" type="button" disabled>Confirm</button>
  <div id="spacer"></div>
  <button id="footer" type="button">Footer action</button>
  <p id="result"></p>
  <div id="overlay">Loading…</div>
  <script>
    // Replay starts right after load, while the overlay still covers the
    // page and Confirm is still disabled. A blind click would be lost.
    const log = (s) => (document.getElementById('result').textContent += s + ';');
    setTimeout(() => document.getElementById('overlay').remove(), 1200);
    document.getElementById('save').addEventListener('click', () => {
      log('saved');
      setTimeout(() => (document.getElementById('confirm').disabled = false), 900);
    });
    document.getElementById('confirm').addEventListener('click', () => log('confirmed'));
    document.getElementById('footer').addEventListener('click', () => log('footer'));
  </script>
</body>
</html>
