name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:

jobs:
  check:
    name: Typecheck, lint, unit tests, builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build
        env:
          # Build-time placeholder only; real deployments set their own.
          BETTER_AUTH_SECRET: ci-build-placeholder-not-a-secret-000000
      - name: Production extension bundle has no secrets or test hooks
        run: |
          if grep -rlE "leoTest|sk-ant|dangerouslyAllowBrowser|api\.anthropic\.com" extension/.output/chrome-mv3; then
            echo "::error::production bundle contains a secret, the SDK, or the e2e hook"; exit 1
          fi

  e2e:
    name: End-to-end (extension in Chromium)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun x playwright install --with-deps chromium
        working-directory: e2e
      - run: bun x playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
